<style>

        const k2 = Math.min(1, k + 0.01), e2 = k2 * k2 * (3 - 2 * k2) * 0.35 + Math.pow(k2, 2.2) * 0.65;
        const nx = sx + (ex - sx) * e2 + Math.sin(k2 * Math.PI) * W * 0.18, ny = sy + (ey - sy) * e2;
        const ang = k < 1 ? Math.atan2(ny - cy, nx - cx) : -Math.PI / 2, ca = Math.cos(ang), sa = Math.sin(ang);
        const size = Math.max(W, H) * (0.03 + 0.62 * Math.pow(k, 1.7));
        ctx.globalCompositeOperation = 'lighter';
        if (t < 1.2 && sp.vis) glow(SW, sx, sy, 70 * F0(S) * (1 - t / 1.2) + 6, 1 - t / 1.2);
        if (k > 0 && k < 1) {
          [-0.27, -0.15, 0.15, 0.27].forEach((o) => {
            const px = cx - ca * size * 0.12 - sa * o * size, py = cy - sa * size * 0.12 + ca * o * size;
            for (let n = 0; n < 2; n++) trail.push({ x: px + rnd(-1, 1), y: py + rnd(-1, 1), age: 0, life: rnd(1.4, 2.4), vx: -ca * rnd(5, 25), vy: -sa * rnd(5, 25), r0: 1.5 + size * 0.008, grow: 4 + size * 0.02, a: 0.32 });
          });
        }
        launchTrail(trail, dt);
        if (k <= 0 || k >= 1) return;
        const dotR = Math.max(1.6, size * 0.012);
        for (const q of JETP) {
          const lx = (q.u - 0.5) * size, ly = (q.v - 0.5) * size * (200 / 220);
          glow(SW, cx + lx * ca - ly * sa, cy + lx * sa + ly * ca, dotR, 0.75 + 0.25 * Math.sin(T * 12 + q.j * 30));
        }
        glow(SC, cx, cy, size * 0.6, 0.22);
      } });
    }
    // a rocket that lifts off from Tanegashima and rises past the camera
    function giantRocket() {
      if (!ROCKP) ROCKP = maskPts(100, 300, 3, (x) => {
        x.fillStyle = '#F3F7FF'; x.fillRect(36, 70, 28, 190);
        x.beginPath(); x.moveTo(36, 72); x.quadraticCurveTo(50, 2, 64, 72); x.closePath(); x.fill();
        x.fillStyle = '#FF5A3C'; x.beginPath(); x.moveTo(40, 40); x.quadraticCurveTo(50, 2, 60, 40); x.closePath(); x.fill();
        x.fillRect(36, 150, 28, 8);
        x.fillStyle = '#F3F7FF'; x.fillRect(16, 140, 16, 110); x.fillRect(68, 140, 16, 110);
        x.beginPath(); x.moveTo(16, 142); x.lineTo(24, 118); x.lineTo(32, 142); x.closePath(); x.fill();
        x.beginPath(); x.moveTo(68, 142); x.lineTo(76, 118); x.lineTo(84, 142); x.closePath(); x.fill();
        x.fillStyle = '#C9D6E8'; x.beginPath(); x.moveTo(36, 255); x.lineTo(28, 290); x.lineTo(72, 290); x.lineTo(64, 255); x.closePath(); x.fill();
      });
      const pad = vec(30.4, 130.97);
      const trail = [];
      let last = 0;
      const SF = spr(255, 170, 70), SY = spr(255, 230, 150);
      effects.push({ t: 0, dur: 6.6, draw(t, S) {
        const dt = Math.max(0, t - last); last = t;
        const pp = proj(pad);
        const sx = pp.vis ? pp.x : W * 0.35, sy = pp.vis ? pp.y : H * 0.7;
        const k = clamp((t - 1.0) / 3.8, 0, 1), e = Math.pow(k, 2.4);
        const cx = sx + Math.sin(k * 1.4) * W * 0.12, cy = sy + (-H * 0.55 - sy) * e;
        const size = Math.max(W, H) * (0.05 + 0.55 * Math.pow(k, 1.5));
        ctx.globalCompositeOperation = 'lighter';
        // ignition on the pad
        if (t < 1.6 && pp.vis) { const ig = Math.min(1, t / 0.6); glow(SF, sx, sy, (30 + 30 * Math.sin(T * 40)) * F0(S) * ig, 0.9 * ig); }
        if (t < 1.4) for (let n = 0; n < 4; n++) trail.push({ x: sx + rnd(-4, 4), y: sy, age: 0, life: rnd(1.2, 2.2), vx: rnd(-60, 60), vy: rnd(-8, 4), r0: 3, grow: 14, a: 0.25 });
        const bottom = { x: cx, y: cy + size * 0.5 };
        if (k > 0 && k < 1) {
          for (let n = 0; n < 5; n++) trail.push({ x: bottom.x + rnd(-1, 1) * size * 0.05, y: bottom.y, age: 0, life: rnd(0.25, 0.5), vx: rnd(-20, 20), vy: rnd(80, 200), r0: size * 0.03 + 2, grow: size * 0.05, a: 0.9, s: n < 2 ? SY : SF });
          for (let n = 0; n < 3; n++) trail.push({ x: bottom.x + rnd(-1, 1) * size * 0.06, y: bottom.y + size * 0.1, age: 0, life: rnd(1.8, 3.0), vx: rnd(-25, 25), vy: rnd(10, 40), r0: size * 0.02 + 2, grow: 10 + size * 0.04, a: 0.22 });
        }
        launchTrail(trail, dt);
        if (k <= 0 || k >= 1) return;
        glow(SY, bottom.x, bottom.y + size * 0.06, size * 0.22, 0.9);
        const dotR = Math.max(1.6, size * 0.012);
        for (const q of ROCKP) {
          const x = cx + (q.u - 0.5) * size / 3, y = cy + (q.v - 0.5) * size;
          const sp2 = q.r > 240 && q.g < 120 ? SF : SW;
          glow(sp2, x, y, dotR, 0.75 + 0.25 * Math.sin(T * 12 + q.j * 30));
        }
      } });
    }
    function ikRare() {
      RX = { t0: T, t: 0, dur: 5.6, mod(q, p, x, y) {
        const tp = RX.tp, d = Math.hypot(x - tp.x, y - tp.y), front = RX.t * 480;
        const band = Math.max(0, 1 - Math.abs(d - front) / 80);
        const lit = clamp((front - d) / 160, 0, 1) * clamp((RX.dur - RX.t) / 1.4, 0, 1);
        return { ox: 0, oy: -band * 18 - lit * 2.5 * Math.abs(Math.sin(T * 7 + q.tw)), h: lit, a: 1 + band * 1.5 };
      } };
      effects.push({ t: 0, dur: 5.6, surge: true, zoom: 1.14, draw() {} });
      later(0.5, giantFlag);
      [0, 0.4, 0.8].forEach((d) => shock(TOKYO, d, 520, 'rgb(' + ACC.join(',') + ')', 3));
      HOT.forEach((c) => {
        const ppl = ringPeople(Math.round(16 + c.v * 30), 8, 26 + c.v * 30, 0.6);
        const tp = proj(TOKYO), p = proj(c.vec), dl = Math.hypot(p.x - tp.x, p.y - tp.y) / 480;
        effects.push({ t: 0, dur: 5.6, draw(t, S) { const tt = t - dl; if (tt < 0) return; drawPeopleAt(c.vec, ppl, tt, t > 4.8 ? (5.6 - t) / 0.8 : 1, S); } });
      });
    }

    // ---- 国外脱出 ----
    function planeFx(planes, dur, zoom) {
      effects.push({ t: 0, dur: dur, zoom: zoom, planes: planes, draw(t) { planes.forEach((pl) => { pl.u = pl.u0 + t * pl.sp; }); } });
    }
    function mkRt(a, b, hk) { const om = Math.acos(clamp(dot(a, b), -1, 1)); return { a: a, b: b, om: om, so: Math.sin(om), h: (hk || 0.05) + om * 0.05 }; }
    const APV = [vec(35.77, 140.39), vec(35.55, 139.78), vec(34.43, 135.23), vec(33.59, 130.45), vec(42.78, 141.69), vec(34.86, 136.81)];
    function farPoint(a) { for (;;) { const b = vec(rnd(-35, 65), rnd(-180, 180)), om = Math.acos(clamp(dot(a, b), -1, 1)); if (om > 0.6 && om < 2.6) return b; } }
    function exTakeoff() {
      const rt = mkRt(APV[0], farPoint(APV[0]), 0.12);
      effects.push({ t: 0, dur: 1.4, draw(t, S) { const p = proj(APV[0]); if (!p.vis) return; ctx.globalCompositeOperation = 'lighter'; glow(SW, p.x, p.y, 60 * F0(S) * (1 - t / 1.4) + 8, 1 - t / 1.4); } });
      planeFx([{ rt: rt, u: -1, u0: -0.02, sp: 0.16, sc: 3.0 }], 6.5, 1.05);
    }
    function exWave() {
      const planes = [];
      for (let k = 0; k < 10; k++) { const a = APV[k % APV.length]; planes.push({ rt: mkRt(a, farPoint(a)), u: -1, u0: -k * 0.05, sp: 0.28, sc: 1.6 }); }
      planeFx(planes, 4.8, 1.04);
    }
    function exCrowd() {
      const dots = [];
      for (let k = 0; k < 120; k++) dots.push({ ap: APV[k % 3], a: Math.random() * TAU, d0: rnd(90, 200), dl: Math.random() * 1.2, sp: rnd(1.4, 2.2) });
      effects.push({ t: 0, dur: 3.6, draw(t, S) {
        const f0 = F0(S);
        ctx.globalCompositeOperation = 'lighter';
        for (const q of dots) {
          const k = clamp((t - q.dl) / q.sp, 0, 1); if (k <= 0 || k >= 1) continue;
          const p = proj(q.ap); if (!p.vis) continue;
          const d = q.d0 * (1 - easeOut(k)) * f0;
          const x = p.x + Math.cos(q.a) * d, y = p.y + Math.sin(q.a) * d * 0.55;
          glow(SW, x, y, 3, Math.sin(k * Math.PI));
          ctx.globalAlpha = 0.35 * Math.sin(k * Math.PI); ctx.strokeStyle = '#BFE6FF'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(q.a) * 12 * f0, y + Math.sin(q.a) * 6.6 * f0); ctx.stroke();
        }
        for (let i = 0; i < 3; i++) { const p = proj(APV[i]); if (p.vis) glow(SC, p.x, p.y, (30 + 20 * Math.sin(t * 6)) * f0, 0.5 + 0.4 * clamp(t - 1.2, 0, 1) * clamp((3.6 - t) / 0.8, 0, 1)); }
      } });
    }
    function exRoutes() {
      const list = [];
      for (let k = 0; k < 18; k++) { const a = APV[k % 2]; list.push({ rt: mkRt(a, vec(rnd(-40, 65), (k / 18) * 360 - 180)), dl: k * 0.05 }); }
      const planes = list.map((it) => ({ rt: it.rt, u: -1, u0: -0.35 - it.dl * 0.3, sp: 0.22, sc: 1.2 }));
      effects.push({ t: 0, dur: 6, draw(t, S) {
        const out = t > 5.2 ? (6 - t) / 0.8 : 1;
        ctx.globalCompositeOperation = 'lighter';
        for (const it of list) {
          const g2 = easeOut(clamp((t - it.dl) / 1.4, 0, 1)); if (g2 <= 0) continue;
          ctx.globalAlpha = 0.85 * out; ctx.strokeStyle = '#A8DCFF'; ctx.lineWidth = 1.6;
          ctx.beginPath(); let pen = false, lastP = null;
          for (let k = 0; k <= 30; k++) { const u = k / 30 * g2, p = proj(slerpV(it.rt.a, it.rt.b, it.rt.om, it.rt.so, u), it.rt.h * Math.sin(Math.PI * u)); if (p.vis) { pen ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); pen = true; lastP = p; } else pen = false; }
          ctx.stroke();
          if (lastP && g2 < 1) glow(SW, lastP.x, lastP.y, 8, 0.9);
        }
      } });
      planeFx(planes, 6, 1);
    }
    function exRare() {
      RX = { t0: T, t: 0, dur: 6.6, mod(q, p, x, y) {
        const lt = RX.t - 1.0 - q.d0 * 0.9;
        let b = 0;
        if (lt > 0 && lt < 1.6) b = Math.pow(lt / 1.6, 2); else if (lt >= 1.6 && lt < 2.6) b = 1; else if (lt >= 2.6 && lt < 4.2) b = 1 - easeOut((lt - 2.6) / 1.6);
        const tp = RX.tp;
        return { ox: (x - tp.x) * 0.5 * b + q.sx * W * 0.12 * b, oy: -b * H * (0.45 + q.d0 * 0.5), h: 0, a: 1 + b * 0.6, col: b > 0.03 ? 'rgb(205,236,255)' : null };
      } };
      const rocket = Math.random() < 0.4;
      const planes = [];
      for (let k = 0; k < (rocket ? 14 : 36); k++) { const a = APV[k % APV.length]; planes.push({ rt: mkRt(a, farPoint(a), 0.08), u: -1, u0: -Math.random() * 0.25 - (rocket ? 0.3 : 0), sp: 0.24, sc: 1.4 }); }
      planeFx(planes, 5.6, 0.9);
      if (rocket) { giantRocket(); shock(vec(30.4, 130.97), 1.0, 300, 'rgb(255,190,110)', 3); }
      else giantJet();
      effects.push({ t: 0, dur: 5.6, draw(t, S) {
        ctx.globalCompositeOperation = 'lighter';
        const p = proj(TOKYO); if (p.vis) glow(SC, p.x, p.y, 200 * F0(S), 0.6 * clamp(1 - t / 2.5, 0, 1));
      } });
    }

    // ---- 祭り ----
    function burstOver(v, hMin, hMax, big, pal, willow) {
      const p = proj(v, 0.02); if (!p.vis) return;
      const f0 = F0(cam.R / 1800);
      addFirework(p.x + rnd(-14, 14) * f0, p.y - rnd(hMin, hMax) * f0, big * f0, pal, willow);
    }
    function maBig() {
      burstOver(TOKYO, 120, 130, 2.6, 5);
      later(0.35, () => burstOver(TOKYO, 60, 80, 1.2, 0));
      later(0.55, () => burstOver(TOKYO, 60, 80, 1.2, 2));
      effects.push({ t: 0, dur: 1.5, zoom: 1.05, draw() {} });
    }
    function maStarmine() {
      for (let k = 0; k < 16; k++) later(k * 0.11, () => { const c = HOT[(Math.random() * Math.min(4, HOT.length)) | 0]; burstOver(c.vec, 40, 110, rnd(0.9, 1.4)); });
    }
    function maLanterns() {
      wave = { t0: T };
      HOT.forEach((c) => later(0.1 + Math.random() * 0.3, () => {}));
      effects.push({ t: 0, dur: 4, draw(t, S) {
        const tp = proj(TOKYO), f0 = F0(S);
        ctx.globalCompositeOperation = 'lighter';
        for (const c of HOT) {
          const p = proj(c.vec); if (!p.vis) continue;
          const k = t * 420 - Math.hypot(p.x - tp.x, p.y - tp.y);
          if (k < 0) continue;
          glow(SAs, p.x, p.y, (50 + 70 * c.v) * f0, Math.max(0, 1 - k / 500) * 0.9);
        }
      } });
    }
    function maNation() {
      HOT.forEach((c) => { later(Math.random() * 0.5, () => burstOver(c.vec, 50, 100, 0.9 + c.v)); later(0.5 + Math.random() * 0.6, () => burstOver(c.vec, 40, 90, 0.7 + c.v * 0.6)); });
    }
    let KANJI = null;
    function kanjiPts() {
      if (KANJI && KANJI.length > 40) return KANJI;
      const c = document.createElement('canvas'); c.width = c.height = 160;
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = '900 138px "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';
      x.fillText('祭', 80, 84);
      const d = x.getImageData(0, 0, 160, 160).data, pts = [];
      for (let yy = 0; yy < 160; yy += 3) for (let xx = 0; xx < 160; xx += 3) if (d[(yy * 160 + xx) * 4 + 3] > 120) pts.push([(xx - 80) / 160, (yy - 80) / 160]);
      KANJI = pts; return pts;
    }
    function kanjiFirework() {
      const parts = kanjiPts().map((q) => ({ tx: q[0], ty: q[1], j: Math.random(), c: Math.random() < 0.78 ? [255, 211, 107] : (Math.random() < 0.5 ? [255, 111, 168] : [255, 244, 214]) }));
      const sprs = {};
      effects.push({ t: 0, dur: 5.4, draw(t, S) {
        const tp = proj(TOKYO);
        const cx = tp.vis ? clamp(tp.x, W * 0.3, W * 0.7) : W / 2;
        const size = Math.min(W * 0.78, H * 0.48);
        const cy = Math.max(size * 0.62, (tp.vis ? tp.y : H * 0.5) - size * 0.55);
        if (t < 0.35) { ctx.globalCompositeOperation = 'lighter'; glow(SW, cx, cy, size * 0.5 * (1 - t / 0.35), 0.9 * (1 - t / 0.35)); }
        ctx.globalCompositeOperation = 'lighter';
        const fly = easeOut(clamp(t / 0.9, 0, 1));
        for (const q of parts) {
          let x = cx + q.tx * size * fly, y = cy + q.ty * size * fly, a;
          if (t > 2.9) { const ft = t - 2.9; y += 0.22 * size * ft * ft + q.j * ft * size * 0.06; }
          a = t < 2.9 ? 0.75 + 0.25 * Math.sin(t * 22 + q.j * 30) : Math.max(0, 1 - (t - 2.9) / 2.2);
          const k = q.c.join(','); const sp = sprs[k] || (sprs[k] = spr(q.c[0], q.c[1], q.c[2]));
          glow(sp, x, y, Math.max(2.6, size * 0.014), a);
        }
      } });
    }
    function maRare() {
      later(0.9, kanjiFirework);
      burstOver(TOKYO, 120, 130, 0.5, 5);
      RX = { t0: T, t: 0, dur: 6, mod(q) {
        const k = clamp(RX.t / 0.8, 0, 1) * clamp((RX.dur - RX.t) / 1.4, 0, 1);
        if (k <= 0) return null;
        return { ox: 0, oy: -Math.abs(Math.sin(T * 3 + q.tw)) * 5 * k, h: k, a: 1 + k * 0.7, col: 'hsl(' + (((q.d0 * 360 + RX.t * 140) | 0) % 360) + ',100%,74%)' };
      } };
      effects.push({ t: 0, dur: 6, zoom: 1.12, draw() {} });
      wave = { t0: T };
      for (let k = 0; k < 26; k++) later(0.2 + k * 0.14, () => { const c = pick(HOT); burstOver(c.vec, 40, 140, rnd(1.0, 1.8)); });
      for (let k = 0; k < 7; k++) later(3.2 + k * 0.25, () => { const c = HOT[k % HOT.length]; burstOver(c.vec, 150, 220, 2.6, 1, true); });
    }

    const FX = [[ikRally, ikFlags, ikMarch, ikPlacards], [exTakeoff, exWave, exCrowd, exRoutes], [maBig, maStarmine, maLanterns, maNation]];
    const RARE = [ikRare, exRare, maRare];
    function vote(rare) {
      ping();
      if (rare) { RARE[MODE](); return; }
      const list = FX[MODE];
      let k = (Math.random() * list.length) | 0;
      if (k === lastFx) k = (k + 1 + ((Math.random() * (list.length - 1)) | 0)) % list.length;
      lastFx = k;
      list[k]();
    }
    function S0() { return cam.R / 1800; }

    resize();
    let ro = null;
    try { ro = new ResizeObserver(() => resize()); ro.observe(root); } catch (e) { window.addEventListener('resize', resize); }
    raf = requestAnimationFrame(frame);
    return {
      vote: vote,
      stop() { alive = false; cancelAnimationFrame(raf); if (ro) ro.disconnect(); else window.removeEventListener('resize', resize); }
    };
  }
}
</script>
